services:
  - type: web
    name: agendamais-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_migrations.py && gunicorn --worker-class eventlet -w 1 wsgi:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agendamais-db
          property: connectionString

databases:
  - name: agendamais-db
    databaseName: agendamais
    user: agendamais_user